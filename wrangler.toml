name = "mojoday"
main = ".open-next/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"

[observability]
enabled = true

# 환경변수는 Cloudflare Dashboard > Workers > Settings > Variables 에 추가하거나
# 아래에 직접 입력 (비공개 값은 wrangler secret put 명령어 사용 권장)
[vars]
NEXT_PUBLIC_SITE_URL = "https://mojoday.app"
